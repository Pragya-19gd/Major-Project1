version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: microgrid-timescaledb
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-microgrid_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-microgrid_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-microgrid_db}
    ports:
      - "5432:5432"
    volumes:
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microgrid_user -d microgrid_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: microgrid-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://microgrid_user:microgrid_secure_password_2026@timescaledb:5432/microgrid_db
      HOST: 0.0.0.0
      PORT: 8000
      SIMULATION_INTERVAL_SECONDS: 1.0
      LOG_LEVEL: info
    ports:
      - "8000:8000"
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: microgrid-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  timescale_data:
    driver: local
